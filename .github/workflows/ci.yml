name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self_repair:
    name: Self-repair coordinator (Python stdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Durable ledger, fencing, intake and completion evidence
        run: python3 -m unittest discover -s scripts/self_repair -p 'test_*.py' -v

  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER="8.30.0"
          curl -fsSLo /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks detect
        run: gitleaks detect --no-git --redact

  go:
    name: Go (fmt/test/vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt check
        run: ./scripts/ci/go_fmt_check.sh
      - name: go test (all modules)
        run: ./scripts/ci/go_test_all.sh
      - name: go vet (all modules)
        run: ./scripts/ci/go_vet_all.sh

  evidence_mysql:
    name: Evidence briefing (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-evidence-fixture
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: cleanapp_evidence_test
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --password=local-evidence-fixture"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      EVIDENCE_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/cleanapp_evidence_test?parseTime=true&charset=utf8mb4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check selection, counts, provenance and dates on MySQL
        working-directory: report-listener
        run: go test ./database -run '^TestEvidence(MySQLFixture|ArchiveNormalizationMySQLFixture)$' -count=1 -v
      - name: Check transactional metadata projection on MySQL
        working-directory: report-listener
        env:
          METADATA_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/metadata_projection_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE metadata_projection_evidence_test;'
          go test ./database -run '^TestMetadataProjectionMySQLFixture$' -count=1 -v
      - name: Check Go grouping against MySQL window and collation semantics
        working-directory: report-listener
        env:
          GROUPING_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/grouping_parity_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE grouping_parity_evidence_test;'
          go test ./database -run '^TestEvidenceGroupingMySQLParityFixture$' -count=1 -v
      - name: Check Wire scalar metadata and bootstrap on MySQL 8.4
        working-directory: report-listener
        env:
          WIRE_META_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/wire_meta_evidence_test?parseTime=true&charset=utf8mb4"
          WIRE_BOOTSTRAP_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/wire_projection_bootstrap_evidence_test?parseTime=true&charset=utf8mb4"
          WIRE_AUDIT_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/wire_audit_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE wire_meta_evidence_test; CREATE DATABASE wire_projection_bootstrap_evidence_test; CREATE DATABASE wire_audit_evidence_test;'
          go test ./database -run '^TestWire(MetaProjection|ProjectionBootstrap)MySQLFixture$' -count=1 -v
          go test ./cmd/backfill-wire-evidence -run '^TestWireAuditMySQLFixture$' -count=1 -v

      - name: Repair cold historical brand projections on MySQL 8.4
        working-directory: report-listener
        env:
          BRAND_REPAIR_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/brand_repair_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE brand_repair_evidence_test;'
          go test ./cmd/backfill-brand-evidence -run '^TestBrandProjectionRepairMySQLFixture$' -count=1 -v

      - name: Check notification receipts, privacy and subscriber access on MySQL
        working-directory: report-listener
        env:
          NOTIFICATION_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/report_notification_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE report_notification_test;'
          go test ./database -run '^TestReportNotificationsMySQLFixture$' -count=1 -v

      - name: Check accepted email events and public evidence selection on MySQL
        working-directory: email-service
        env:
          EMAIL_NOTIFICATION_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/email_notification_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE email_notification_test;'
          go test ./service -run '^TestNotificationMySQL$' -count=1 -v

      - name: Check report contact suggestions cannot become global routing on MySQL
        working-directory: report-analyze-pipeline
        env:
          CONTACTS_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/pipeline_contact_routing_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE pipeline_contact_routing_test;'
          go test ./contacts -run '^TestContactRoutingMySQLFixture$' -count=1 -v

  evidence_original_mysql:
    name: Original lookup and online index (MySQL 8.0.44)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: local-evidence-fixture
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: original_resolver_evidence_test
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --password=local-evidence-fixture"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      EVIDENCE_ORIGINAL_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/original_resolver_evidence_test?parseTime=true&charset=utf8mb4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve large retained originals without sorting payloads
        working-directory: report-analyze-pipeline
        run: go test ./service -run '^TestLargeWireOriginalAvoidsPayloadSortMySQL$' -count=1 -v
      - name: Add a covering index without rebuilding FULLTEXT analysis history
        working-directory: report-listener
        env:
          EVIDENCE_INDEX_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/classification_cover_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE classification_cover_evidence_test;'
          go test ./database -run '^TestEvidenceIndexMySQLFixture$' -count=1 -v
      - name: Preserve original source JSON, identity and date semantics
        working-directory: report-listener
        env:
          EVIDENCE_SOURCE_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/source_normalization_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE source_normalization_evidence_test;'
          go test ./database -run '^TestEvidenceSourceNormalizationMySQLFixture$' -count=1 -v
      - name: Maintain cohort source headers without changing intake constraints
        working-directory: report-listener
        env:
          EII_HEADER_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/eii_header_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE eii_header_evidence_test;'
          go test ./database -run '^TestEIIHeaderProjectionMySQLFixture$' -count=1 -v
      - name: Compare the complete reader and narrow archive path with SQL
        working-directory: report-listener
        env:
          EVIDENCE_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/reader_parity_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE reader_parity_evidence_test;'
          go test ./database -run '^TestEvidence(MySQLFixture|ArchiveNormalizationMySQLFixture)$' -count=1 -v
      - name: Preserve Wire JSON nodes, cascades, bootstrap and cohort audit
        working-directory: report-listener
        env:
          WIRE_META_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/wire_meta_evidence_test?parseTime=true&charset=utf8mb4"
          WIRE_BOOTSTRAP_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/wire_projection_bootstrap_evidence_test?parseTime=true&charset=utf8mb4"
          WIRE_AUDIT_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/wire_audit_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE wire_meta_evidence_test; CREATE DATABASE wire_projection_bootstrap_evidence_test; CREATE DATABASE wire_audit_evidence_test;'
          go test ./database -run '^TestWire(MetaProjection|ProjectionBootstrap)MySQLFixture$' -count=1 -v
          go test ./cmd/backfill-wire-evidence -run '^TestWireAuditMySQLFixture$' -count=1 -v
      - name: Repair cold historical brand projections on MySQL 8.0
        working-directory: report-listener
        env:
          BRAND_REPAIR_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/brand_repair_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE brand_repair_evidence_test;'
          go test ./cmd/backfill-brand-evidence -run '^TestBrandProjectionRepairMySQLFixture$' -count=1 -v

      - name: Exclude completed worker candidates before source lookups
        working-directory: report-analyze-pipeline
        env:
          EVIDENCE_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/worker_gate_evidence_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE worker_gate_evidence_test;'
          go test ./database -run '^(TestPendingEvidenceMySQL|TestEvidenceCursorMySQL)' -count=1 -v

      - name: Check notification receipts, privacy and subscriber access on MySQL 8.0
        working-directory: report-listener
        env:
          NOTIFICATION_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/report_notification_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE report_notification_test;'
          go test ./database -run '^TestReportNotificationsMySQLFixture$' -count=1 -v

      - name: Check accepted email events and public evidence selection on MySQL 8.0
        working-directory: email-service
        env:
          EMAIL_NOTIFICATION_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/email_notification_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE email_notification_test;'
          go test ./service -run '^TestNotificationMySQL$' -count=1 -v

      - name: Check report contact quarantine on MySQL 8.0
        working-directory: report-analyze-pipeline
        env:
          CONTACTS_TEST_DSN: "root:local-evidence-fixture@tcp(127.0.0.1:33306)/pipeline_contact_routing_test?parseTime=true&charset=utf8mb4"
        run: |
          docker exec -e MYSQL_PWD=local-evidence-fixture ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE pipeline_contact_routing_test;'
          go test ./contacts -run '^TestContactRoutingMySQLFixture$' -count=1 -v

  golangci:
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.6
          golangci-lint --version
      - name: golangci-lint (all modules)
        run: ./scripts/ci/golangci_lint_all.sh

  rust:
    name: Rust (fmt/clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: cargo fmt --check
        run: ./scripts/ci/rust_fmt_check.sh
      - name: cargo clippy
        run: ./scripts/ci/rust_clippy_check.sh

  integration-analyzer:
    name: Integration (Analyzer Golden Path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker info
        run: docker version && docker compose version
      - name: Analyzer golden path
        env:
          RABBITMQ_MGMT_USER: guest
          RABBITMQ_MGMT_PASSWORD: guest
        run: make ci-analyzer

  integration-ingest-v1:
    name: Integration (Fetcher Key Ingest v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker info
        run: docker version && docker compose version
      - name: OpenAPI validate (ingest v1)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -w /work openapitools/openapi-generator-cli validate -i openapi/cleanapp-ingest.v1.yaml
      - name: Ingest v1 golden path
        run: make ci-ingest-v1

  integration-cleanapp-wire:
    name: Integration (CleanApp Wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker info
        run: docker version && docker compose version
      - name: OpenAPI validate (CleanApp Wire)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -w /work openapitools/openapi-generator-cli validate -i openapi/cleanapp-wire.v1.yaml
      - name: CleanApp Wire golden path
        run: make ci-cleanapp-wire
