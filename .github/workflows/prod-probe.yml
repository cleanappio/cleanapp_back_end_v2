name: Probe public production endpoints (read-only)

# Temporary diagnostic on this branch only: GETs public URLs, changes nothing.
on:
  push:
    branches: [claude/prod-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: |
          probe() { printf '%s -> ' "$1"; curl -sS -o /tmp/body -w '%{http_code} %{size_download}B %{time_total}s %{content_type}\n' --compressed --max-time 60 "$1" || true; }
          for base in https://renderer.cleanapp.io https://embed.cleanapp.io; do
            probe "$base/version"; head -c 400 /tmp/body; echo
            probe "$base/api/v4/version"; head -c 400 /tmp/body; echo
          done
          for u in https://embed.cleanapp.io/ https://www.cleanapp.io/; do echo "HEADERS $u"; curl -sS -D - -o /tmp/page.html --compressed --max-time 30 "$u" | grep -i -E "^(HTTP|cache-control|etag|last-modified|age|server|cf-cache-status|x-nextjs|expires|vary|content-type|x-powered-by|via):" | sed 's/^/HEADERS   /'; echo "HEADERS   bytes=$(wc -c < /tmp/page.html) chunks=$(grep -o '/_next/static/[^"]*' /tmp/page.html | sort -u | wc -l) build=$(grep -o '/_next/static/[A-Za-z0-9_-]*/_buildManifest.js' /tmp/page.html | head -1)"; done
          chunk=$(grep -o '/_next/static/chunks/[^"]*\.js' /tmp/page.html | head -1); echo "HEADERS chunk $chunk"; curl -sS -D - -o /dev/null --max-time 30 "https://www.cleanapp.io$chunk" | grep -i -E "^(HTTP|cache-control|etag|last-modified|age|cf-cache-status):" | sed 's/^/HEADERS   /'
          chunk=$(curl -sS --compressed https://embed.cleanapp.io/ | grep -o '/_next/static/chunks/[^"]*\.js' | head -1); echo "HEADERS embed chunk $chunk"; curl -sS -D - -o /dev/null --max-time 30 "https://embed.cleanapp.io$chunk" | grep -i -E "^(HTTP|cache-control|etag|last-modified|age|cf-cache-status):" | sed 's/^/HEADERS   /'
          echo "HEADERS missing-chunk"; curl -sS -o /dev/null -w 'HEADERS   %{http_code} %{content_type}\n' https://embed.cleanapp.io/_next/static/chunks/does-not-exist-123.js
          probe https://renderer.cleanapp.io/health; head -c 300 /tmp/body; echo
          probe https://renderer.cleanapp.io/stats; head -c 300 /tmp/body; echo
          probe https://renderer.cleanapp.io/api/v4/reports/tiles/0/0/0
          probe https://renderer.cleanapp.io/api/v4/reports/tiles/2/2/1
          probe https://embed.cleanapp.io/api/v4/reports/tiles/0/0/0
          probe "https://renderer.cleanapp.io/api/v4/reports/hotspots?limit=5"; head -c 400 /tmp/body; echo
          probe "https://renderer.cleanapp.io/api/v4/reports/points?classification=physical"
          probe "https://renderer.cleanapp.io/api/v4/brands/summary?classification=digital&lang=en"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open the public map in a browser and report its data requests
        run: |
          mkdir -p "$RUNNER_TEMP/check" && cd "$RUNNER_TEMP/check"
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@latest >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          cp "$GITHUB_WORKSPACE/.github/probe/map-check.cjs" . && node map-check.cjs
