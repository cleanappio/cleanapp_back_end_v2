name: Probe public production endpoints (read-only)

# Temporary diagnostic on this branch only: GETs public URLs, changes nothing.
on:
  push:
    branches: [claude/prod-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          for u in https://www.cleanapp.io/uptime.json https://cleanapp.io/uptime.json; do
            echo "STATUS $u -> $(curl -sS -o /tmp/u.json -w '%{http_code} %{size_download}B' --compressed --max-time 20 "$u")"
            python3 -c "
          import json,sys
          try:
              d=json.load(open('/tmp/u.json'))
          except Exception as e:
              print('STATUS not json', e); sys.exit(0)
          s=json.dumps(d)
          for i in range(0,len(s),900): print('STATUSJSON', s[i:i+900])
          "
          done
