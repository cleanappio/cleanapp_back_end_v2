name: Probe public production endpoints (read-only)

# Temporary diagnostic on this branch only: loads public pages, changes nothing.
on:
  push:
    branches: [claude/prod-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: |
          for o in https://embed.cleanapp.io https://www.cleanapp.io https://cleanapp.io https://evil.example; do
            echo "CORS areas from $o: $(curl -sS -o /tmp/b -D - --max-time 15 -H "Origin: $o" 'https://areas.cleanapp.io/api/v3/get_areas?sw_lat=47.36&sw_lon=8.52&ne_lat=47.38&ne_lon=8.55&type=poi' | grep -i -E '^(HTTP|access-control-allow-origin)' | tr '\r\n' '  ') bytes=$(wc -c < /tmp/b)"
          done
          echo "CORS areas version: $(curl -sS --max-time 15 https://areas.cleanapp.io/version | head -c 300)"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open the mobile map in phone-sized browsers
        run: |
          mkdir -p "$RUNNER_TEMP/check" && cd "$RUNNER_TEMP/check"
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@latest >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          cp "$GITHUB_WORKSPACE/.github/probe/map-check.cjs" . && node map-check.cjs
