name: Probe public production endpoints (read-only)

# Temporary diagnostic on this branch only: GETs public URLs, changes nothing.
on:
  push:
    branches: [claude/prod-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          for u in https://www.cleanapp.io/r/x https://live.cleanapp.io/r/x https://live.cleanapp.io/api/v3/r/x; do
            echo "LINK $u -> $(curl -sS -o /dev/null -w '%{http_code} location=%{redirect_url}' --max-time 20 "$u")"
          done
          for u in https://live.cleanapp.io/version https://email.cleanapp.io/version; do
            echo "VER $u -> $(curl -sS --max-time 20 "$u" | head -c 300)"
          done
