# Physical 500 buyer preview only. Included in both apex and www TLS vhosts.
# The standalone service owns authentication, opaque server-side sessions and all assets.
# Preserve the /licensing URI prefix; do not route through Next.js or a DB service.
location = /licensing {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Cache-Control "private, no-store, max-age=0" always;
    return 308 https://cleanapp.io/licensing/;
}

location ^~ /licensing/ {
    # Canonicalize only this preview to the apex host; the ordinary site keeps
    # its existing apex-to-www behavior. A return-only nginx if is intentional.
    if ($host = www.cleanapp.io) {
        return 308 https://cleanapp.io$request_uri;
    }
    proxy_pass http://127.0.0.1:8795;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";

    # Stream individual originals without buffering them to nginx temporary storage.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    client_max_body_size 16k;
    limit_except GET HEAD POST { deny all; }

    # Every response, including authenticated images, is private and unindexed.
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Pragma;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Referrer-Policy;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
