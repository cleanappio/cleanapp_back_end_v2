groups:
  - name: cleanapp-analyzer
    rules:
      - alert: AnalyzerRabbitMQDisconnected
        expr: cleanapp_analyzer_rabbitmq_connected == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Analyzer RabbitMQ disconnected"
          description: "Analyzer {{ $labels.job }} reports RabbitMQ disconnected for 5+ minutes."
      - alert: HumanAnalyzerUnavailable
        expr: up{job="report-analyze-human"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Human report analyzer unavailable"
          description: "The isolated mobile analyzer cannot be scraped for 2+ minutes."
      - alert: AgentAnalyzerUnavailable
        expr: up{job="report-analyze-pipeline"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Agent report analyzer unavailable"
          description: "The machine report analyzer cannot be scraped for 2+ minutes."
      - alert: HumanReportAnalysisQueueMissing
        expr: absent(rabbitmq_queue_state{queue="report-analysis-human-queue",state="running"}) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Human report queue missing"
          description: "The mobile report queue is missing or stopped for 2+ minutes."
      - alert: HumanAnalyzerStalled
        expr: >-
          (cleanapp_analyzer_rabbitmq_worker_in_flight{job="report-analyze-human"} > 0)
          and on(job, instance)
          ((sum by(job, instance) (increase(cleanapp_analyzer_rabbitmq_processed_total{job="report-analyze-human",result="success"}[5m]))
          or on(job, instance) (0 * cleanapp_analyzer_rabbitmq_worker_in_flight{job="report-analyze-human"})) == 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Human report analyzer stalled"
          description: "The mobile analyzer holds work without a successful completion for 5+ minutes."
      - alert: ReportAnalysisQueueMissing
        expr: absent(rabbitmq_queue_state{queue="report-analysis-queue",state="running"}) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "report-analysis-queue missing"
          description: "report-analysis-queue is missing (or not running) for 5+ minutes."
      - alert: AgentReportAnalysisUnconsumedBacklog
        # kbudde/rabbitmq_exporter queue gauges; a missing consumers series must
        # not turn a known backlog into an empty (healthy) result.
        expr: >-
          (rabbitmq_queue_messages_ready{queue="report-analysis-queue"} > 0)
          unless on(job, instance, cluster, vhost, queue)
          (rabbitmq_queue_consumers{queue="report-analysis-queue"} > 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Agent report backlog has no consumer"
          description: "report-analysis-queue has waiting reports but no observed active consumer for 2+ minutes."
      - alert: AgentReportAnalysisQueueTelemetryMissing
        # A visible queue with omitted management statistics cannot prove an
        # empty backlog or a healthy consumer. Keep that blind spot observable.
        expr: >-
          max by(job, instance, cluster, vhost, queue)
          (rabbitmq_queue_state{queue="report-analysis-queue"} == 1)
          unless on(job, instance, cluster, vhost, queue)
          (rabbitmq_queue_messages_ready{queue="report-analysis-queue"}
          and on(job, instance, cluster, vhost, queue)
          rabbitmq_queue_consumers{queue="report-analysis-queue"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Agent report queue telemetry missing"
          description: "report-analysis-queue is visible but its ready-message or consumer gauge is missing for 2+ minutes; backlog health cannot be verified."
      - alert: ReportTagsQueueMissing
        expr: absent(rabbitmq_queue_state{queue="report-tags-queue",state="running"}) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "report-tags-queue missing"
          description: "report-tags-queue is missing (or not running) for 5+ minutes."
      - alert: ReportRendererQueueMissing
        expr: absent(rabbitmq_queue_state{queue="report-renderer-queue",state="running"}) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "report-renderer-queue missing"
          description: "report-renderer-queue is missing (or not running) for 5+ minutes."
      - alert: ReportAnalysisRetryTraffic
        expr: increase(rabbitmq_queue_messages_published_total{queue="report-analysis-queue.retry"}[15m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "report-analysis retries detected"
          description: "Messages are hitting report-analysis-queue.retry over a sustained period."
